[project]
name = "tinyquant-bench"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "tinyquant",
    "lm-eval>=0.4.4",
    "transformers>=4.40",
    "accelerate>=0.30",
]

[project.optional-dependencies]
nf4 = ["bitsandbytes>=0.47.0"]
higgs = ["higgs-kernels>=0.3.0"]
hqq = ["hqq>=0.2.1"]
wandb = ["wandb>=0.17"]
all = [
    "bitsandbytes>=0.47.0",
    "higgs-kernels>=0.3.0",
    "hqq>=0.2.1",
    "wandb>=0.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tinyquant_bench"]

[tool.uv.sources]
tinyquant = { workspace = true }
